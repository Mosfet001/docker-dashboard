# ─────────────────────────────────────────────────────────────
#  nginx/default.conf
#  Reverse proxy for Docker Dashboard
#  HTTP → redirects to HTTPS if certs exist, serves directly otherwise
# ─────────────────────────────────────────────────────────────

upstream client_upstream {
    server client:80;
}

upstream api_upstream {
    server server:3001;
    keepalive 32;
}

# ── HTTP server ───────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-Content-Type-Options  nosniff;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # Serve React SPA
    location / {
        proxy_pass         http://client_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # REST API
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;

        # SSE support (Docker events stream)
        proxy_buffering    off;
        proxy_cache        off;
    }

    # WebSocket — stats, logs, exec
    location /ws/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # keep WS alive for 1 hr
        proxy_send_timeout 3600s;
    }

    # Health check endpoint (no auth, used by Docker)
    location = /api/health {
        proxy_pass http://api_upstream;
        access_log off;
    }
}

